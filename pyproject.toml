[project]
name = "bruriah"
version = "0.3.0"
description = "Work-intelligence MCP server: evidence-backed answers from your own history"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Leonardo Caliva" }]
keywords = ["mcp", "model-context-protocol", "retrieval", "provenance", "prompt-injection", "agents"]
# The wheel is py3-none-any and now genuinely runs on all three families. Windows activation is
# implemented in `src/bruriah/winfs.py` against the Win32 primitives, not emulated: it needs
# Windows 10 1607+ on NTFS for POSIX-semantics rename, which `winfs.posix_replace` enforces at use
# time rather than pretending about here. `bruriah/__init__.py` states the same requirement as a
# capability check, because most people never read classifiers.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]

dependencies = [
  "fastembed==0.8.0",
  "markdown-it-py>=4.0.0,<5",
  "mcp>=1.28.1,<2",
  "platformdirs>=4.11,<5",
  "pydantic>=2.13.4,<3",
  "pyyaml>=6.0.3,<7",
  "sqlite-vec==0.1.9",
]

[project.urls]
Homepage = "https://github.com/leonardoprimero/bruriah"
Source = "https://github.com/leonardoprimero/bruriah"
Issues = "https://github.com/leonardoprimero/bruriah/issues"

[project.scripts]
bruriah = "bruriah.cli:bruriah_main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "bruriah"

[dependency-groups]
dev = [
  "pip-audit>=2.10.0,<3",
  "pytest>=9.0.2,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
# No `filterwarnings` guard against unclosed connections, though one was tried and is worth
# someone finishing. An unclosed SQLite connection is not cosmetic here: on POSIX it is a
# descriptor nobody notices, because unlink succeeds against an open file, while on Windows the
# same connection makes the file undeletable -- which is how a leak in `promote_candidate` reached
# CI as an `index-prune` failure and as nothing at all locally. But the warning is raised by the
# garbage collector, outside the context pytest applies these filters in, so neither
# `error::ResourceWarning` nor `error::pytest.PytestUnraisableExceptionWarning` fails a test that
# deliberately leaks one; both were probed. Catching it needs real machinery, not a filter line,
# and a filter line that looks like a guard without being one is the thing this project refuses
# everywhere else. The suite is currently clean of them, which is what makes the next one visible.
