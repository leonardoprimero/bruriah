name: I want native Windows support
description: Not a bug -- a vote. Windows currently refuses to import on purpose.
labels: [platform, windows]
body:
  - type: markdown
    attributes:
      value: |
        Activation swaps a pointer under `flock` with `O_NOFOLLOW` and re-confirms the file's
        identity afterwards; that is what makes promoting a snapshot atomic and unspoofable.
        Windows has different primitives with different semantics, and a half-ported version of
        that guarantee would fail silently instead of loudly, which is worse than not having it.

        So it is deliberately undone, not forgotten. **Knowing someone is actually waiting is what
        would make it worth doing carefully.** That is what this issue is for.
  - type: checkboxes
    id: wsl
    attributes:
      label: Have you tried WSL?
      description: It is a real Linux and needs no changes to Bruriah.
      options:
        - label: "Yes, and it does not work for my situation (explain below)"
        - label: "No"
  - type: textarea
    id: why
    attributes:
      label: Why WSL is not enough for you
      description: This is the part that would actually change the decision.
    validations: {required: true}
