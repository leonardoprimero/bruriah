# The suite ran green on my laptop, which is a claim about my laptop. This runs it on machines I
# do not control, on every supported Python version, and then installs the built wheel into a clean
# environment and uses it -- because the two defects that made this package unpublishable were both
# invisible to a suite running from a clone.
#
# Windows is in the matrix because it is now supported, and because the defect that made a Windows
# checkout arrive corrupt -- CRLF rewriting digest-verified packs -- is invisible to every other
# runner by construction. A platform nobody runs in CI is a platform nobody supports.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `release.yml` calls this rather than restating the matrix, so the gate a publish passes is
  # this file and cannot quietly become a weaker copy of it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0   # the eval guard rebuilds the corpus from this repository's own history
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
      # Nine jobs downloading the same ~130 MB embedding model at once is what widening this matrix
      # actually bought, and Hugging Face answered with 429s -- one cell went red for a reason that
      # had nothing to do with the code in it. Caching it removes the flake and the rudeness at the
      # same time. The key hashes `cli.py` because that is where the model is pinned: any edit there
      # busts the cache, which over-invalidates slightly and can never serve the wrong model. A
      # needless download costs a minute; a stale one would silently embed against a different
      # space, which is the failure `index` fails closed on and CI should never manufacture.
      - name: cache the embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/fastembed_cache
          key: fastembed-${{ runner.os }}-${{ hashFiles('src/bruriah/cli.py') }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: pytest
        env:
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed_cache
        run: uv run --no-sync python -m pytest tests -q -p no:randomly -rs

  # `pip-audit` sat in `[dependency-groups] dev` from the beginning and no job ever ran it, which is
  # the worst of both: the cost of declaring a security tool and none of the signal. A vulnerability
  # in a transitive dependency of a package whose pitch is trust boundaries should not first be
  # heard about from a user.
  #
  # It audits the LOCKED resolution, not a fresh one, because the lock is what CI tests and what a
  # `uv sync --locked` reproduces -- auditing anything else would report on a dependency set nobody
  # runs. Its own job: an advisory published overnight turns this one cell red without also
  # withholding the test results for the change under review.
  audit:
    name: dependencies have no known advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - run: uv sync --locked
      - name: pip-audit
        run: uv run --no-sync pip-audit --skip-editable

  package:
    name: wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - run: uv build
      - name: metadata is valid for PyPI
        run: uv tool run --from twine twine check dist/*
      - name: install the artifact into a clean environment
        run: |
          uv venv --python 3.13 /tmp/clean
          VIRTUAL_ENV=/tmp/clean uv pip install dist/*.whl
      - name: run the documented workflow with nothing cloned
        # Deliberately NOT `uv run`: this has to exercise the installed console script, which is
        # what a reader gets, rather than the source tree the previous job already covered.
        #
        # And the commands are EXTRACTED from the README rather than copied into this file, because
        # a copy drifts and this one did: the job is named for running the documented workflow, and
        # for a while it ran a different one -- its own older version, with the data directory set
        # through environment variables the README never mentions. A quickstart that is only
        # asserted is a quickstart nobody runs. This makes the front page the thing under test, so
        # if it stops working, stops being the first bash block, or starts naming a flag that does
        # not exist, this job is what says so.
        run: |
          set -euo pipefail
          python3 - <<'EXTRACT' > /tmp/quickstart.sh
          import pathlib, re
          block = re.search(
              r"```bash\n(.*?)```", pathlib.Path("README.md").read_text(encoding="utf-8"), re.S
          ).group(1)
          # `pip install` alone is dropped: the wheel under test is already installed, from dist/
          # rather than from PyPI, which is the entire point of this job.
          print("".join(l for l in block.splitlines(keepends=True) if not l.startswith("pip install")))
          EXTRACT
          echo "--- the quickstart, as the README states it ---"; cat /tmp/quickstart.sh
          mkdir -p /tmp/demo && cd /tmp/demo && git init -q .
          git config user.email ci@example.invalid && git config user.name CI
          echo x > note.md && git add -A
          git commit -q -m "feat: choose sqlite

          Because the whole point is that it runs on a laptop with nothing to operate."
          export PATH=/tmp/clean/bin:$PATH
          source /tmp/quickstart.sh
          # Written OUTSIDE the repository: the next assertion is that the quickstart leaves the
          # repository it reads untouched, and a check that dirties the tree it is checking passes
          # or fails for its own reasons.
          bruriah doctor --data-dir "$B/data" | tee /tmp/doctor.json
          grep -q '"healthy": true' /tmp/doctor.json
          test -z "$(git status --porcelain)"  # the quickstart must not write into the repo it reads

  # An action referenced by tag or branch (`@v4`, `@release/v1`) is a MUTABLE pointer: the action's
  # maintainers, or anyone who compromises them, can move it under us between one run and the next.
  # Pinning every step to a commit SHA closes that path, but pinning decays -- the next step anyone
  # adds will be written the convenient way unless something objects. This is the something.
  #
  # It reads the workflow files as text rather than trusting review, and it runs in the same CI
  # `release.yml` calls as its gate, so an unpinned step cannot reach a publish. Local actions
  # (`./.github/...`) are exempt: they are this repository's own files at this repository's own
  # commit, and there is no third party to pin.
  pinned:
    name: actions are pinned to immutable refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: every `uses:` names a 40-character commit SHA
        run: |
          set -euo pipefail
          python3 - <<'CHECK'
          import pathlib, re, sys

          offenders = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.search(r"^\s*(?:-\s*)?uses:\s*(\S+)", line)
                  if not match:
                      continue
                  ref = match.group(1)
                  if ref.startswith("./"):
                      continue  # this repository's own file, at this repository's own commit
                  _, separator, version = ref.partition("@")
                  if not separator or not re.fullmatch(r"[0-9a-f]{40}", version):
                      offenders.append(f"{path}:{number}: {ref}")

          if offenders:
              print("These steps use a mutable ref. Pin them to a commit SHA:")
              print("\n".join(f"  {line}" for line in offenders))
              print("\n  gh api repos/OWNER/REPO/commits/TAG --jq .sha")
              print("  then write `uses: OWNER/REPO@<sha>  # <tag>`")
              sys.exit(1)
          print("every third-party action is pinned to a commit SHA")
          CHECK
