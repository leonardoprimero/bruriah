# Publishing, with the three things that went wrong before made impossible rather than remembered.
#
# 0.1.0 through 0.3.0 were published by hand, with `twine` and an API token living in a file on a
# laptop. That token is a long-lived credential with upload rights to this project, kept on the one
# machine most likely to be lost, and nothing about it expires. Trusted Publishing removes it: PyPI
# accepts a short-lived OIDC token minted by GitHub for this repository, this workflow file and
# this environment, and there is no secret to store, rotate, or leak.
#
# ONE-TIME SETUP ON PyPI, which no workflow can do for you. On the project's page, under
# Publishing -> Add a new pending/trusted publisher, GitHub:
#
#     Owner:                leonardoprimero
#     Repository:           bruriah
#     Workflow name:        release.yml
#     Environment name:     pypi
#
# The environment is not decoration: it is a second place the identity is pinned, so a workflow
# added to this repository under a different name cannot publish even though it runs in it.
#
# EVERY ACTION IS PINNED TO A COMMIT SHA, with its version in a trailing comment. `@v4` and
# `@release/v1` are not versions -- they are mutable pointers the action's own maintainers, or
# anyone who compromises them, can move under us between one run and the next. That is a live
# supply-chain path into this workflow, and `pypa/gh-action-pypi-publish@release/v1` was the worst
# instance of it: a BRANCH ref on the one job that holds `id-token: write`. Whoever moved that
# branch could have published as this project, and removing the stored API token above would have
# bought nothing, because the credential was never the weakest link once the code minting it was
# mutable. A SHA is the only ref GitHub cannot repoint. `ci.yml` is pinned the same way, since it
# is this workflow's gate and a compromised test step can pass a red suite as green.
#
# The cost is that updates are now explicit: read the action's changelog, resolve the new tag to
# its SHA, and change both the SHA and the comment in the same edit. `ci.yml`'s `actions are
# pinned to immutable refs` job fails the build if a step is ever added without one.
#
# WHAT THIS REFUSES TO PUBLISH, each one a mistake already made here once:
#
#   1. A version bumped without `uv lock` in the same commit. It does not show locally, because
#      `uv run --python X` re-resolves in silence; only `--locked` reads the lockfile as written.
#      Measured before this file was added: bumping the version and running `uv lock --check`
#      exits 1, and exits 0 after `uv lock`.
#   2. A tag that does not name the version pyproject declares. Tagging v0.4.0 over a pyproject
#      still saying 0.3.0 produces an artifact whose name and contents disagree.
#   3. A red suite. This calls ci.yml rather than restating its matrix, so the gate is the CI that
#      already exists -- nine cells across Linux, macOS and Windows, plus the wheel-installs-and-
#      runs job -- and cannot drift into a weaker copy. 0.2.0 went out with main red.
#
# Tag, push the tag, and this does the rest. Nothing here publishes on a branch push.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  suite:
    name: the whole of CI, as the gate
    uses: ./.github/workflows/ci.yml

  gate:
    name: the tag, the lockfile, the artifact
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: the tag names the version pyproject declares
        run: |
          set -euo pipefail
          declared=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          echo "tag ${GITHUB_REF_NAME} -> ${tagged} · pyproject -> ${declared}"
          test "$tagged" = "$declared"

      - name: the lockfile was updated in the same commit as the version
        run: uv lock --check

      - run: uv build
      - name: metadata is valid for PyPI
        run: uv tool run --from twine twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: upload to PyPI without a token
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The whole point. Short-lived, minted for this repository and workflow, verified by PyPI
      # against the trusted publisher configured there. `contents` stays read: publishing needs
      # nothing from the repository it has not already been given.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
